name: OFA backup

on:
  workflow_dispatch:
  schedule:
    - cron: '7 3 * * *'
      timezone: Europe/Oslo

permissions:
  contents: read

concurrency:
  group: ofa-backup
  cancel-in-progress: false

jobs:
  backup:
    # Secrets are only available to reviewed code on the default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test backup safeguards
        run: python3 -m unittest discover -s scripts/backup -p 'test_*.py' -v
      - name: Install backup tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates curl age rclone
          curl --fail --silent --show-error --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo install -m 644 /tmp/pgdg.asc /usr/share/keyrings/pgdg.asc
          echo 'deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Back up, encrypt, upload and verify
        env:
          OFA_DB_HOST: ${{ secrets.OFA_DB_HOST }}
          OFA_DB_PORT: ${{ secrets.OFA_DB_PORT }}
          OFA_DB_USER: ${{ secrets.OFA_DB_USER }}
          OFA_DB_PASSWORD: ${{ secrets.OFA_DB_PASSWORD }}
          OFA_DB_CA_CERT: ${{ secrets.OFA_DB_CA_CERT }}
          OFA_S3_ENDPOINT: ${{ secrets.OFA_S3_ENDPOINT }}
          OFA_S3_REGION: ${{ secrets.OFA_S3_REGION }}
          OFA_S3_ACCESS_KEY_ID: ${{ secrets.OFA_S3_ACCESS_KEY_ID }}
          OFA_S3_SECRET_ACCESS_KEY: ${{ secrets.OFA_S3_SECRET_ACCESS_KEY }}
          OFA_DRIVE_CLIENT_ID: ${{ secrets.OFA_DRIVE_CLIENT_ID }}
          OFA_DRIVE_CLIENT_SECRET: ${{ secrets.OFA_DRIVE_CLIENT_SECRET }}
          OFA_DRIVE_TOKEN: ${{ secrets.OFA_DRIVE_TOKEN }}
          OFA_DRIVE_BACKUP_FOLDER_ID: ${{ secrets.OFA_DRIVE_BACKUP_FOLDER_ID }}
          OFA_BACKUP_AGE_RECIPIENT: ${{ secrets.OFA_BACKUP_AGE_RECIPIENT }}
        run: python3 scripts/backup/backup.py
      - name: Report job failure
        if: failure()
        run: echo '::error::OFA backup failed. Check the failed stage. The previous last-success.json must not be treated as a new backup.'
